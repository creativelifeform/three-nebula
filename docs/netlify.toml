# Netlify configuration for the `three-nebula-docs` site (the API reference at
# three-nebula-docs.netlify.com).
#
# For Netlify to use this file, set the site's **Base directory** to `docs` in
# Site configuration → Build & deploy. Netlify then auto-installs from
# docs/package-lock.json, runs the build below, and publishes docs/dist.
#
# The docs are generated with TypeDoc from the TypeScript source. This replaced
# ESDoc, which is JavaScript-only and silently produced empty docs after the
# v12.0.0 TypeScript migration.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
